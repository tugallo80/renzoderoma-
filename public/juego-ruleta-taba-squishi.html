<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruleta Rosa, Verde y Taba Squishi</title>
<style>
  :root{
    --rosa:#ff5fa2;
    --verde:#3ddc84;
    --taba:#ffd23f;
    --bg1:#1b0c2e;
    --bg2:#3a1259;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:22px;
    padding:24px;
    font-family:'Segoe UI', system-ui, sans-serif;
    background:radial-gradient(circle at top, var(--bg2), var(--bg1));
    color:#fff;
    text-align:center;
    overflow-x:hidden;
  }
  h1{
    margin:0;
    font-size:1.8rem;
    text-shadow:0 2px 8px rgba(0,0,0,.4);
  }
  #turno{
    font-size:1.3rem;
    font-weight:bold;
    padding:10px 24px;
    border-radius:30px;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(4px);
    transition:transform .3s;
  }
  #turno.pulse{ transform:scale(1.12); }
  .wheel-wrap{
    position:relative;
    width:min(340px, 80vw);
    height:min(340px, 80vw);
  }
  #pointer{
    position:absolute;
    top:-14px;
    left:50%;
    transform:translateX(-50%);
    width:0; height:0;
    border-left:18px solid transparent;
    border-right:18px solid transparent;
    border-top:28px solid #fff;
    z-index:3;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));
  }
  #wheel{
    width:100%;
    height:100%;
    border-radius:50%;
    border:8px solid #fff;
    box-shadow:0 0 0 4px rgba(255,255,255,.2), 0 12px 40px rgba(0,0,0,.5);
    transition:transform 4.5s cubic-bezier(.16,.85,.3,1);
    display:block;
  }
  #hub{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:56px; height:56px;
    border-radius:50%;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.6rem;
    box-shadow:0 4px 12px rgba(0,0,0,.4);
    z-index:2;
  }
  button{
    font-size:1.1rem;
    font-weight:bold;
    padding:14px 38px;
    border:none;
    border-radius:40px;
    cursor:pointer;
    background:linear-gradient(135deg, var(--rosa), #c73866);
    color:#fff;
    box-shadow:0 6px 18px rgba(255,95,162,.45);
    transition:transform .15s, box-shadow .15s, opacity .2s;
  }
  button:hover:not(:disabled){ transform:translateY(-2px); }
  button:active:not(:disabled){ transform:translateY(0); }
  button:disabled{ opacity:.5; cursor:not-allowed; }

  #resultado{
    min-height:32px;
    font-size:1.25rem;
    font-weight:bold;
  }

  #historial{
    max-width:420px;
    font-size:.85rem;
    opacity:.75;
    line-height:1.5;
  }

  /* Modal Taba Squishi */
  #overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,.72);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:10;
    padding:16px;
  }
  #overlay.show{ display:flex; }
  #modal{
    background:#241338;
    border-radius:20px;
    padding:28px 24px;
    max-width:380px;
    width:100%;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
    border:2px solid rgba(255,255,255,.15);
  }
  #modal h2{
    margin:0 0 4px;
    font-size:1.3rem;
  }
  #modal p.sub{
    margin:0 0 18px;
    opacity:.75;
    font-size:.9rem;
  }
  #colorGrid{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:10px;
    margin-bottom:18px;
  }
  .swatch{
    aspect-ratio:1/1;
    border-radius:12px;
    border:3px solid rgba(255,255,255,.25);
    transition:transform .15s, border-color .15s, box-shadow .15s;
  }
  .swatch.active{
    transform:scale(1.18);
    border-color:#fff;
    box-shadow:0 0 0 4px rgba(255,255,255,.3), 0 6px 16px rgba(0,0,0,.5);
  }
  .swatch[data-c="rosa"]{ background:var(--rosa); }
  .swatch[data-c="verde"]{ background:var(--verde); }
  .swatch[data-c="blanco"]{ background:#ffffff; }
  .swatch[data-c="transparente"]{
    background:
      linear-gradient(45deg, #555 25%, transparent 25%) 0 0/16px 16px,
      linear-gradient(45deg, transparent 75%, #555 75%) 0 0/16px 16px,
      linear-gradient(45deg, #555 25%, #333 25%) 8px 8px/16px 16px,
      linear-gradient(45deg, #333 75%, #555 75%) 8px 8px/16px 16px;
    background-color:#444;
  }
  .swatch[data-c="rojo"]{ background:#ff2e4d; }

  #modalResultado{
    font-size:1.15rem;
    font-weight:bold;
    min-height:28px;
    margin-bottom:14px;
  }
  #modal button{
    background:linear-gradient(135deg, var(--verde), #1e9e5c);
    box-shadow:0 6px 18px rgba(61,220,132,.4);
  }

  .confetti{
    position:fixed;
    top:-20px;
    width:10px; height:10px;
    border-radius:2px;
    pointer-events:none;
    z-index:20;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{ transform:translateY(105vh) rotate(360deg); opacity:.9; }
  }
</style>
</head>
<body>

  <h1>🎡 Ruleta: Rosa, Verde &amp; Taba Squishi</h1>
  <div id="turno">Turno de: <span id="turnoNombre">—</span></div>

  <div class="wheel-wrap">
    <div id="pointer"></div>
    <svg id="wheel" viewBox="0 0 300 300"></svg>
    <div id="hub">🎲</div>
  </div>

  <button id="btnGirar">Girar la ruleta</button>
  <div id="resultado"></div>
  <div id="historial"></div>

  <div id="overlay">
    <div id="modal">
      <h2>🌀 ¡Taba Squishi!</h2>
      <p class="sub">Eligiendo un color al azar...</p>
      <div id="colorGrid"></div>
      <div id="modalResultado"></div>
      <button id="btnCerrarModal">Continuar</button>
    </div>
  </div>

<script>
(function(){
  const jugadores = ["Renzo", "Viki"];
  const segmentos = [
    { label: "Rosa",         color: "#ff5fa2" },
    { label: "Verde",        color: "#3ddc84" },
    { label: "Taba Squishi", color: "#ffd23f" },
    { label: "Rosa",         color: "#ff5fa2" },
    { label: "Verde",        color: "#3ddc84" },
    { label: "Taba Squishi", color: "#ffd23f" },
  ];
  const coloresTaba = ["rosa", "verde", "blanco", "transparente", "rojo"];
  const nombreColor = {
    rosa: "Rosa", verde: "Verde", blanco: "Blanco",
    transparente: "Transparente", rojo: "Rojo"
  };

  const svg = document.getElementById('wheel');
  const btnGirar = document.getElementById('btnGirar');
  const resultadoEl = document.getElementById('resultado');
  const historialEl = document.getElementById('historial');
  const turnoNombreEl = document.getElementById('turnoNombre');
  const turnoEl = document.getElementById('turno');
  const overlay = document.getElementById('overlay');
  const colorGrid = document.getElementById('colorGrid');
  const modalResultado = document.getElementById('modalResultado');
  const btnCerrarModal = document.getElementById('btnCerrarModal');

  let rotacionActual = 0;
  let girando = false;
  const historial = [];

  // --- Construir la ruleta como SVG (sectores) ---
  function construirRuleta(){
    const cx = 150, cy = 150, r = 148;
    const n = segmentos.length;
    const anguloSeg = 360 / n;
    let html = '';

    segmentos.forEach((seg, i) => {
      const start = i * anguloSeg;
      const end = start + anguloSeg;
      const p1 = puntoEnCirculo(cx, cy, r, start);
      const p2 = puntoEnCirculo(cx, cy, r, end);
      const largeArc = anguloSeg > 180 ? 1 : 0;
      html += `<path d="M${cx},${cy} L${p1.x},${p1.y} A${r},${r} 0 ${largeArc} 1 ${p2.x},${p2.y} Z" fill="${seg.color}" stroke="#ffffff" stroke-width="2"/>`;

      // texto
      const mid = start + anguloSeg / 2;
      const tp = puntoEnCirculo(cx, cy, r * 0.62, mid);
      html += `<text x="${tp.x}" y="${tp.y}" fill="#2a1533" font-size="15" font-weight="bold" text-anchor="middle" dominant-baseline="middle" transform="rotate(${mid + 90}, ${tp.x}, ${tp.y})">${seg.label}</text>`;
    });

    svg.innerHTML = html;
  }

  function puntoEnCirculo(cx, cy, r, angDeg){
    const rad = (angDeg - 90) * Math.PI / 180;
    return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
  }

  // --- Turnos al azar ---
  function elegirTurnoAlAzar(){
    const nombre = jugadores[Math.floor(Math.random() * jugadores.length)];
    turnoNombreEl.textContent = nombre;
    turnoEl.classList.add('pulse');
    setTimeout(() => turnoEl.classList.remove('pulse'), 300);
    return nombre;
  }

  // --- Girar ruleta ---
  function girar(){
    if (girando) return;
    girando = true;
    btnGirar.disabled = true;
    resultadoEl.textContent = '';

    const n = segmentos.length;
    const anguloSeg = 360 / n;
    const indiceGanador = Math.floor(Math.random() * n);

    // El puntero está arriba (0°). Calculamos cuánto rotar para que
    // el centro del segmento ganador quede bajo el puntero.
    const centroSegmento = indiceGanador * anguloSeg + anguloSeg / 2;
    const vueltasExtra = 6 + Math.floor(Math.random() * 3); // 6-8 vueltas
    const offsetAzar = (Math.random() - 0.5) * (anguloSeg * 0.5);
    const rotacionFinal = rotacionActual + vueltasExtra * 360 + (360 - centroSegmento) + offsetAzar;

    rotacionActual = rotacionFinal;
    svg.style.transform = `rotate(${rotacionFinal}deg)`;

    setTimeout(() => {
      const jugadorActual = turnoNombreEl.textContent;
      const seg = segmentos[indiceGanador];
      resultadoEl.textContent = `🎯 ${jugadorActual}: ¡${seg.label}!`;
      registrarHistorial(`${jugadorActual} → ${seg.label}`);

      if (seg.label === 'Taba Squishi') {
        setTimeout(() => abrirTabaSquishi(jugadorActual), 500);
      } else {
        finalizarRonda();
      }
    }, 4600);
  }

  function finalizarRonda(){
    girando = false;
    btnGirar.disabled = false;
    elegirTurnoAlAzar();
  }

  function registrarHistorial(texto){
    historial.unshift(texto);
    if (historial.length > 8) historial.pop();
    historialEl.innerHTML = 'Historial: ' + historial.join(' · ');
  }

  // --- Cuadro Taba Squishi ---
  function construirGridColores(){
    colorGrid.innerHTML = '';
    coloresTaba.forEach(c => {
      const div = document.createElement('div');
      div.className = 'swatch';
      div.dataset.c = c;
      colorGrid.appendChild(div);
    });
  }

  function abrirTabaSquishi(jugador){
    construirGridColores();
    modalResultado.textContent = '';
    btnCerrarModal.disabled = true;
    overlay.classList.add('show');

    const swatches = Array.from(colorGrid.children);
    const colorGanador = coloresTaba[Math.floor(Math.random() * coloresTaba.length)];

    let vueltas = 0;
    const totalVueltas = 18 + Math.floor(Math.random() * 6);
    let idxActual = 0;

    const intervalo = setInterval(() => {
      swatches.forEach(s => s.classList.remove('active'));
      idxActual = (idxActual + 1) % swatches.length;
      swatches[idxActual].classList.add('active');
      vueltas++;

      if (vueltas >= totalVueltas) {
        clearInterval(intervalo);
        swatches.forEach(s => s.classList.remove('active'));
        const ganadorEl = colorGrid.querySelector(`[data-c="${colorGanador}"]`);
        ganadorEl.classList.add('active');
        modalResultado.textContent = `✨ ${jugador} obtiene: ${nombreColor[colorGanador]}`;
        registrarHistorial(`Taba Squishi(${jugador}) → ${nombreColor[colorGanador]}`);
        btnCerrarModal.disabled = false;
        lanzarConfetti();
      }
    }, 110);
  }

  btnCerrarModal.addEventListener('click', () => {
    overlay.classList.remove('show');
    finalizarRonda();
  });

  // --- Confetti simple ---
  function lanzarConfetti(){
    const colores = ['#ff5fa2', '#3ddc84', '#ffd23f', '#ff2e4d', '#ffffff'];
    for (let i = 0; i < 40; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colores[Math.floor(Math.random() * colores.length)];
      c.style.animationDuration = (2 + Math.random() * 1.5) + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 3600);
    }
  }

  btnGirar.addEventListener('click', girar);

  // Inicializar
  construirRuleta();
  elegirTurnoAlAzar();
})();
</script>

</body>
</html>
